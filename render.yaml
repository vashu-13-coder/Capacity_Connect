services:
  - type: web
    name: capacity-connect-backend
    runtime: python
    buildCommand: "bash backend/build.sh"
    startCommand: "python backend/manage.py migrate --noinput && python backend/manage.py bootstrap_admin && gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:$PORT --workers 4 --threads 2 --timeout 60"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: DB_ENGINE
        value: sqlite
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,.vercel.app,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://capacity-connect.vercel.app,http://localhost:5500,http://127.0.0.1:5500"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://capacity-connect.vercel.app,http://localhost:5500,http://127.0.0.1:5500"
      - key: SUPABASE_URL
        value: "https://jnevchtixesdwwkbjkez.supabase.co"
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: DJANGO_ADMIN_USERNAME
        value: "Admin"
      - key: DJANGO_ADMIN_EMAIL
        sync: false
      - key: DJANGO_ADMIN_PASSWORD
        sync: false
